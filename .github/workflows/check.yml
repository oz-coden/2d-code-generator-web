name: Check 2D code generation and browser behavior
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: node --check script.js
      - run: node --check vendor/ui/ui.js
      - run: node --check vendor/qrcodegen/qrcodegen.js
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
